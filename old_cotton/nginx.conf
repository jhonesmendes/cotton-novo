# ═══════════════════════════════════════════════════════════════════════════════
# nginx.conf — Cotton Fibra Forte
# Servidor: 192.168.3.3  |  Domínio: cotton.jhontisystem.com.br
# ═══════════════════════════════════════════════════════════════════════════════
#
# INSTALAÇÃO:
#   sudo cp nginx.conf /etc/nginx/sites-available/cotton
#   sudo ln -s /etc/nginx/sites-available/cotton /etc/nginx/sites-enabled/cotton
#   sudo nginx -t          # Testar configuração
#   sudo systemctl reload nginx
#
# WEBROOT DO FRONTEND:  /var/www/cotton/
# BACKEND:              http://localhost:3001
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    server_name cotton.jhontisystem.com.br 192.168.3.3;

    # ─── Raiz do frontend compilado (React) ───────────────────────────────────
    root /var/www/cotton;
    index index.html;

    # ─── Charset e gzip ───────────────────────────────────────────────────────
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── Headers de segurança ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Proxy reverso para a API (backend Node.js) ───────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';

        proxy_read_timeout    300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;

        # Sem cache para rotas da API
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── Health check do backend ──────────────────────────────────────────────
    location /health {
        proxy_pass       http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ─── Assets estáticos com cache longo (hash no nome do arquivo) ──────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── SPA React — todas as rotas retornam index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── Limites de upload ────────────────────────────────────────────────────
    client_max_body_size 10M;

    # ─── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/cotton-access.log;
    error_log  /var/log/nginx/cotton-error.log;
}
