# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Sobrescreve o compose de dev: builda as imagens de produção (target "prod"),
# tira hot-reload/Adminer e exige as variáveis reais de produção via .env.
services:
  adminer:
    profiles: !override ["tools"]

  postgres:
    ports: !override []

  backend:
    build:
      context: ./backend
      target: prod
    # o frontend já repassa /api pro backend pela rede interna do Docker
    # (ver frontend/nginx.conf) — não precisa publicar a porta no host.
    ports: !override []
    environment: !override
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cotton_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
    volumes: !override []
    command: sh -c "npx prisma migrate deploy && node dist/app.js"

  frontend:
    build:
      context: ./frontend
      target: prod
    environment: !override {}
    ports: !override
      - "${FRONTEND_PORT:-80}:80"
    volumes: !override []
